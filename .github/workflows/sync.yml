name: Sync timetable

# The Worker dispatches this every 5 minutes and on demand. The schedule is a backup.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was requested
        required: false
        default: manual
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Working database from the last run. The job hydrates from D1 when its revision moved on.
      - uses: actions/cache/restore@v4
        with:
          path: server/data
          key: sync-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sync-data-
      - name: Run sync job
        run: npx tsx server/src/job/run.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SYNC_REASON: ${{ inputs.reason || github.event_name }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: server/data
          key: sync-data-${{ github.run_id }}-${{ github.run_attempt }}
